[package]
name = "dstub"
version = "0.1.0"
edition = "2021"
authors = ["N0D4N"]
readme = "README.md"
repository = "https://github.com/TanteiBot/dstub"
license-file = "LICENSE"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
incremental = true

[dependencies]
tokio = { version = "1.37.0", features = ["macros", "rt-multi-thread", "time"] }
serenity = { default-features = false, features = ["http", "model", "utils", "rustls_backend", "client", "gateway"], version = "0.12.1" }
clap = { version = "4.5.4", features = ["derive"] }